[package]
name = "csvedit"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A simple CSV editor"
repository = "https://github.com/Shhu/csvedit"
build = "build.rs"

[dependencies]
calamine = "0.38"
compact_str = "0.10.0"
eframe = "0.36.2"
egui-phosphor = "0.14"
# Character maps of the built-in fonts (already used by egui).
skrifa = "0.44"
encoding_rs = "0.8.42"
fluent-bundle = "0.16"
memchr = "2.7"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
sys-locale = "0.3"
unicode-segmentation = "1"
zip = { version = "9.5", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
fluent-syntax = "0.12"
rust_xlsxwriter = "0.102.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
